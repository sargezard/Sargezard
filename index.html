<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARGEZARD - Scarlet & Violet: 151 Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-2xl mb-10">
        <header class="text-center mb-4">
            <h1 class="text-3xl font-black text-yellow-400 tracking-wider">SARGEZARD</h1>
            <p class="text-xs text-slate-400 mt-1">Scarlet & Violet: 151 Collection Tracker</p>
            <div class="mt-3 bg-slate-900 rounded-full h-3 overflow-hidden border border-slate-700">
                <div id="progress-bar" class="bg-yellow-400 h-full transition-all" style="width: 0%"></div>
            </div>
            <p id="progress-text" class="text-xs text-slate-400 mt-2 font-medium">0 / 165 Collected</p>
            
            <!-- Quick Jump Dropdown -->
            <div class="mt-4 text-left">
                <label class="block text-[11px] font-semibold text-slate-400 mb-1">🔍 Quick Jump to Card:</label>
                <select id="quick-jump" onchange="jumpToCard(this.value)" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-yellow-400">
                    <!-- Populated via script -->
                </select>
            </div>
        </header>

        <!-- Card View Area -->
        <div id="card-container" class="space-y-3">
            <div class="flex justify-between items-center bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700">
                <span id="card-number" class="text-xs font-bold bg-slate-800 px-2.5 py-1 rounded-full text-slate-300">#1</span>
                <span id="card-type" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-950 text-blue-300 border border-blue-800">Grass</span>
            </div>
            
            <div>
                <h2 id="card-name" class="text-2xl font-black text-white">Bulbasaur</h2>
                <p id="card-artist" class="text-xs text-slate-400 mt-0.5">🎨 Illus. Yoriyuki Ikegami</p>
            </div>
            
            <div class="bg-slate-950 border border-slate-800 rounded-xl h-64 flex items-center justify-center overflow-hidden p-2">
                <img id="card-image" src="https://images.pokemontcg.io/sv3pt5/1_hires.png" alt="Card Scan" class="h-full object-contain rounded-md shadow-lg" />
            </div>

            <!-- Card Stats or Description Box -->
            <div id="card-info-box" class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/60 text-xs space-y-1.5">
                <!-- Dynamically filled -->
            </div>

            <!-- Quantities -->
            <div class="grid grid-cols-3 gap-2 pt-1">
                <div class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-center">
                    <span class="block text-[10px] font-bold text-slate-300 mb-1">Standard</span>
                    <select id="qty-normal" onchange="updateQty('normal', this.value)" class="bg-slate-950 text-yellow-400 font-bold text-xs rounded px-2 py-1 w-full border border-slate-700">
                        <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
                    </select>
                </div>
                <div class="bg-purple-950/40 border border-purple-800/60 rounded-xl p-2 text-center">
                    <span class="block text-[10px] font-bold text-purple-300 mb-1">✨ Holo</span>
                    <select id="qty-holo" onchange="updateQty('holo', this.value)" class="bg-slate-950 text-purple-300 font-bold text-xs rounded px-2 py-1 w-full border border-slate-700">
                        <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
                    </select>
                </div>
                <div class="bg-indigo-950/40 border border-indigo-800/60 rounded-xl p-2 text-center">
                    <span class="block text-[10px] font-bold text-indigo-300 mb-1">🌟 Rev Holo</span>
                    <select id="qty-rev" onchange="updateQty('rev', this.value)" class="bg-slate-950 text-indigo-300 font-bold text-xs rounded px-2 py-1 w-full border border-slate-700">
                        <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
                    </select>
                </div>
            </div>

            <!-- Ownership status tag -->
            <div id
