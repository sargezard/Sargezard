<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARGEZARD - Scarlet & Violet: 151 Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-2xl mb-10">
        <header class="text-center mb-4">
            <h1 class="text-3xl font-black text-yellow-400 tracking-wider">SARGEZARD</h1>
            <p class="text-xs text-slate-400 mt-1">Scarlet & Violet: 151 Collection Tracker</p>
            <div class="mt-3 bg-slate-900 rounded-full h-3 overflow-hidden border border-slate-700">
                <div id="progress-bar" class="bg-yellow-400 h-full transition-all" style="width: 0%"></div>
            </div>
            <p id="progress-text" class="text-xs text-slate-400 mt-2 font-medium">0 / 165 Collected</p>
            
            <!-- Quick Jump Dropdown -->
            <div class="mt-4 text-left">
                <label class="block text-[11px] font-semibold text-slate-400 mb-1">🔍 Quick Jump to Card:</label>
                <select id="quick-jump" onchange="jumpToCard(this.value)" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-yellow-400">
                </select>
            </div>
        </header>

        <!-- Card View Area -->
        <div id="card-container" class="space-y-3">
            <div class="flex justify-between items-center bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700">
                <span id="card-number" class="text-xs font-bold bg-slate-800 px-2.5 py-1 rounded-full text-slate-300">#1</span>
                <span id="card-type" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-950 text-blue-300 border border-blue-800">Grass</span>
            </div>
            
            <div>
                <h2 id="card-name" class="text-2xl font-black text-white">Bulbasaur</h2>
                <p id="card-artist" class="text-xs text-slate-400 mt-0.5">🎨 Illus. Yoriyuki Ikegami</p>
            </div>
            
            <!-- Tap to Zoom Card Image Container -->
            <div id="image-box" onclick="toggleZoom()" class="relative bg-slate-950 border border-slate-800 rounded-xl h-64 flex flex-col items-center justify-center overflow-hidden p-2 cursor-pointer transition-all duration-300">
                <img id="card-image" src="https://images.pokemontcg.io/sv3pt5/1_hires.png" alt="Card Scan" class="h-full object-contain rounded-md shadow-lg transition-all" />
                <span id="zoom-hint" class="absolute bottom-2 right-2 bg-slate-900/80 text-yellow-400 border border-slate-700 text-[10px] px-2 py-0.5 rounded-full font-bold">🔍 Tap to Expand</span>
            </div>

            <!-- Card Stats or Description Box -->
            <div id="card-info-box" class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/60 text-xs space-y-1.5">
            </div>

            <!-- Quantities -->
            <div class="grid grid-cols-3 gap-2 pt-1">
                <div class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-center">
                    <span class="block text-[10px] font-bold text-slate-300 mb-1">Standard</span>
                    <select id="qty-normal" onchange="updateQty('normal', this.value)" class="bg-slate-950 text-yellow-400 font-bold text-xs rounded px-2 py-1 w-full border border-slate-700">
                        <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
                    </select>
                </div>
                <div class="bg-purple-950/40 border border-purple-800/60 rounded-xl p-2 text-center">
                    <span class="block text-[10px] font-bold text-purple-300 mb-1">✨ Holo</span>
                    <select id="qty-holo" onchange="updateQty('holo', this.value)" class="bg-slate-950 text-purple-300 font-bold text-xs rounded px-2 py-1 w-full border border-slate-700">
                        <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
                    </select>
                </div>
                <div class="bg-indigo-950/40 border border-indigo-800/60 rounded-xl p-2 text-center">
                    <span class="block text-[10px] font-bold text-indigo-300 mb-1">🌟 Rev Holo</span>
                    <select id="qty-rev" onchange="updateQty('rev', this.value)" class="bg-slate-950 text-indigo-300 font-bold text-xs rounded px-2 py-1 w-full border border-slate-700">
                        <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
                    </select>
                </div>
            </div>

            <!-- Ownership status tag -->
            <div id="status-badge" class="w-full py-2 rounded-xl font-bold text-center text-xs shadow-md bg-slate-900 text-slate-500 border border-slate-700">
                Not Yet Collected
            </div>

            <!-- Navigation Controls -->
            <div class="flex gap-2 pt-2">
                <button onclick="changeCard(-1)" class="flex-1 bg-slate-700 hover:bg-slate-600 py-3 rounded-xl text-xs font-bold text-slate-200 transition-all">Previous</button>
                <button onclick="changeCard(1)" class="flex-1 bg-yellow-500 hover:bg-yellow-400 py-3 rounded-xl text-xs font-bold text-slate-950 transition-all">Next Card</button>
            </div>
        </div>

        <!-- Export / Import Buttons -->
        <div class="flex gap-2 mt-4 pt-4 border-t border-slate-700">
            <button onclick="exportData()" class="flex-1 bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold py-2.5 rounded-xl shadow-lg text-xs transition-all">
                📤 Export Backup
            </button>
            <button onclick="document.getElementById('import-file').click()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold py-2.5 rounded-xl shadow-lg text-xs transition-all border border-slate-600">
                📥 Load Backup
            </button>
            <input type="file" id="import-file" onchange="importData(event)" accept=".sargezard,.json" class="hidden" />
        </div>
    </div>

        let currentIndex = 0;
        let collection = JSON.parse(localStorage.getItem('sargezard_data_v165')) || {};
        let isZoomed = false;

        function initQuickJump() {
            const select = document.getElementById('quick-jump');
            select.innerHTML = '';
            cards.forEach((c, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                const d = collection[c.id];
                const owned = d && (d.normal > 0 || d.holo > 0 || d.rev > 0);
                opt.text = `#${c.id} - ${c.name} ${owned ? '✓' : ''}`;
                select.appendChild(opt);
            });
        }

        function render() {
            const card = cards[currentIndex];
            document.getElementById('card-number').innerText = `#${card.id}`;
            document.getElementById('card-type').innerText = card.type;
            document.getElementById('card-name').innerText = card.name;
            document.getElementById('card-artist').innerText = `🎨 Illus. ${card.illustrator || 'Official'}`;
            document.getElementById('card-image').src = `https://images.pokemontcg.io/sv3pt5/${card.id}_hires.png`;

            // Info Box / Stats
            const infoBox = document.getElementById('card-info-box');
            if (card.type === "Trainer") {
                infoBox.innerHTML = `<p class="text-slate-300 text-[11px] leading-snug">${card.desc || 'Trainer Card'}</p>`;
            } else {
                infoBox.innerHTML = `
                    <div class="grid grid-cols-3 gap-2 text-center pb-1.5 border-b border-slate-800">
                        <div><span class="block text-slate-500">HP</span><strong class="text-slate-200">${card.hp || '-'}</strong></div>
                        <div><span class="block text-slate-500">Stage</span><strong class="text-slate-200">${card.stage || 'Basic'}</strong></div>
                        <div><span class="block text-slate-500">Retreat</span><strong class="text-slate-200">${card.retreat || '1'}</strong></div>
                    </div>
                    ${card.attackName ? `<div class="flex justify-between font-bold text-yellow-300 pt-0.5"><span>⚔️ ${card.attackName}</span><span>${card.attackDmg}</span></div>` : ''}
                `;
            }

            const data = collection[card.id] || { normal: 0, holo: 0, rev: 0 };
            document.getElementById('qty-normal').value = data.normal;
            document.getElementById('qty-holo').value = data.holo;
            document.getElementById('qty-rev').value = data.rev;

            document.getElementById('quick-jump').value = currentIndex;

            // Status badge
            const badge = document.getElementById('status-badge');
            if (data.normal > 0 || data.holo > 0 || data.rev > 0) {
                badge.className = "w-full py-2 rounded-xl font-bold text-center text-xs shadow-md bg-emerald-600/30 text-emerald-300 border border-emerald-500/50";
                badge.innerText = "✓ Registered in Collection";
            } else {
                badge.className = "w-full py-2 rounded-xl font-bold text-center text-xs shadow-md bg-slate-900 text-slate-500 border border-slate-700";
                badge.innerText = "Not Yet Collected";
            }

            updateProgress();
        }

        function toggleZoom() {
            const box = document.getElementById('image-box');
            const hint = document.getElementById('zoom-hint');
            isZoomed = !isZoomed;
            if (isZoomed) {
                box.classList.remove('h-64');
                box.classList.add('h-[420px]');
                hint.innerText = "🔍 Tap to Shrink";
            } else {
                box.classList.remove('h-[420px]');
                box.classList.add('h-64');
                hint.innerText = "🔍 Tap to Expand";
            }
        }

        function updateQty(type, val) {
            const card = cards[currentIndex];
            if (!collection[card.id]) collection[card.id] = { normal: 0, holo: 0, rev: 0 };
            collection[card.id][type] = Number(val);
            localStorage.setItem('sargezard_data_v165', JSON.stringify(collection));
            initQuickJump();
            render();
        }

        function changeCard(dir) {
            currentIndex = (currentIndex + dir + cards.length) % cards.length;
            render();
        }

        function jumpToCard(val) {
            currentIndex = Number(val);
            render();
        }

        function updateProgress() {
            let owned = 0;
            cards.forEach(c => {
                const d = collection[c.id];
                if (d && (d.normal > 0 || d.holo > 0 || d.rev > 0)) owned++;
            });
            const pct = (owned / cards.length) * 100;
            document.getElementById('progress-bar').style.width = pct + '%';
            document.getElementById('progress-text').innerText = `${owned} / ${cards.length} Collected`;
        }

        function exportData() {
            const payload = JSON.stringify({
                app: "SARGEZARD_151_TRACKER",
                version: "4.0",
                exportedAt: new Date().toISOString(),
                collection: collection
            }, null, 2);

            const blob = new Blob([payload], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `sargezard-collection.sargezard`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (parsed && parsed.collection) {
                        collection = parsed.collection;
                        localStorage.setItem('sargezard_data_v165', JSON.stringify(collection));
                        initQuickJump();
                        render();
                        alert("Collection loaded successfully!");
                    }
                } catch (err) {
                    alert("Invalid backup file.");
                }
            };
            reader.readAsText(file);
        }

        initQuickJump();
        render();
    </script>
